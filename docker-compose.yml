services:
  # Renders the Blocky and Traefik configs from .env, then exits.
  config-init:
    image: busybox:1.37.0
    restart: "no"
    network_mode: none
    command: ["sh", "/config-init.sh"]
    volumes:
      - ./config-init.sh:/config-init.sh:ro
      - ./blocky.yml:/blocky-template.yml:ro
      - ./.env:/env-file:ro
      - blocky-config:/blocky
      - ${TRAEFIK_DYNAMIC_DIR:-/etc/dokploy/traefik/dynamic}:/traefik-dynamic

  blocky:
    image: spx01/blocky:v0.35.0
    restart: unless-stopped
    depends_on:
      config-init:
        condition: service_completed_successfully
    environment:
      BLOCKY_CONFIG_FILE: /config/config.yml
    volumes:
      - blocky-config:/config:ro
    networks:
      dokploy-network:
        # Unique name so it cannot collide with another app's "blocky" service
        # on the shared Traefik network.
        aliases:
          - private-doh-blocky
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck", "--bindip", "127.0.0.1", "--port", "5353"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  blocky-config:

networks:
  dokploy-network:
    external: true
